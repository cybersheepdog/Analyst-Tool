[EXCLUSIONS]
# Domains or IPs to SKIP for lookups (comma-separated). Matched by host, so it
# covers subdomains AND IP forms — excluding 192.168.1.42 also skips
# 192.168.1.42:8080 and 192.168.1.42/tool. Pre-filled with the tool's own
# reference-link domains so copying a link it printed won't trigger a lookup.
# Add or remove entries as you like; leave blank to disable.
domains = ultimatewindowssecurity.com, speedguide.net, virustotal.com, otx.alienvault.com, abuseipdb.com, shodan.io, nvd.nist.gov, cisa.gov, crt.sh, iana.org, dan.me.uk, lolbas-project.github.io, loldrivers.io

[GENERAL]
# Verify TLS certificates on outbound API calls. Leave as true.
# Set to false ONLY if you are behind a TLS-intercepting proxy or must talk to
# services using self-signed certs: requests will then retry with verification
# disabled on SSL errors, and API clients are built without verification.
ssl_verify = true

[CACHE]
# Cache external lookups (VirusTotal, AbuseIPDB, Shodan, OTX) so repeat
# lookups within freshness_days are served from the DB instead of spending an
# API call. Set enabled = false to turn caching off entirely.
enabled = true
# backend: local (SQLite file, single user) or remote (PostgreSQL, shared team)
backend = local
# A cached result younger than this many days is reused instead of re-querying.
freshness_days = 7
# Local SQLite database file (used when backend = local).
db_path = analyst_cache.db
# Copy an indicator prefixed with this to force a fresh lookup, e.g. !8.8.8.8
force_prefix = !
# Delete cached entries older than this many days at startup (0 = never purge).
purge_days = 0
# Identity recorded in the shared check-log. Blank = your OS login name.
# Give each analyst a unique value when sharing a remote database.
user =
# Window (in days) for the "X users have checked this indicator" notice.
check_window_days = 7
# A re-check by the SAME user within this many minutes is not counted again
# (prevents rapid re-copies from inflating the count).
check_dedup_minutes = 60
# Prefix that marks a clipboard COMMAND (notes/tags) rather than an indicator,
# e.g. >>note 8.8.8.8 confirmed phishing #c2   (see NOTE_COMMANDS.md).
command_prefix = >>
# How many team notes to show at the top of a report before "(+N more)".
max_notes_shown = 5
# How often (minutes) to refresh the shared exclusion list from the DB, so a
# teammate's >>exclude propagates without restarting.
exclusion_refresh_minutes = 5
# Remote PostgreSQL settings (used only when backend = remote):
host =
port = 5432
dbname =
db_user =
password =
# TLS for the DB connection. 'prefer' uses TLS if the server offers it but
# SILENTLY falls back to an unencrypted connection — do not rely on it when the
# database holds shared secrets. RECOMMENDED: 'require' (encrypt, no fallback),
# or 'verify-full' with the server's CA cert for full protection against MITM.
# Only use 'require'/'verify-full' once you've confirmed the server has TLS
# enabled, or connections will fail.
sslmode = prefer

[REPORT]
# >>report exports the last lookup(s) to a ticket-ready file. Where to save:
dir = reports
# markdown (fenced code block — renders cleanly in Jira/ServiceNow/GitHub)
# or text (plain, with banner separators).
format = markdown
# Defang indicators in the export (8[.]8[.]8[.]8, hxxp://) so it's safe to
# paste anywhere. Only the reported indicators are defanged, not all text.
defang = true
# How many recent reports are kept in memory for ">>report N" (max 100).
max_kept = 20

[SHARED_CONFIG]
# Optional envelope encryption for the shared API keys stored in the remote
# database. When a passphrase is available the tool encrypts each key value
# before it is stored and decrypts it after reading, so the database, its
# backups, and anyone with only a DB login never see plaintext keys.
#
# The passphrase itself is NEVER stored in the database or (ideally) in this
# file. Provide it in ONE of two ways, checked in this order:
#   1. Environment variable  ANALYST_SHARED_KEY=<passphrase>   (preferred)
#   2. A local file whose path you put in key_file below (readable only by you).
# Leave key_file blank and don't set the env var to keep keys as plaintext
# (backward-compatible). Every analyst must use the SAME passphrase.
key_file =

# ─────────────────────────────────────────────────────────────────────────────
# API keys (sections below).
# If [CACHE] backend = remote, the tool loads shared API keys from the team
# database FIRST and falls back to whatever you set locally here. So a value
# present in the shared database wins; anything not set there uses your local
# value below. This lets analysts share keys without copying them into every
# machine. Only these credential fields are shared — identities, paths and
# other settings always stay local. If a passphrase is configured (see
# [SHARED_CONFIG] above) the shared values are encrypted at rest.
# Seed the shared keys once (any machine with the DB credentials):
#     python analyst_tool_shared_config.py import-local     # push your local keys up
#     python analyst_tool_shared_config.py set VIRUS_TOTAL x-apikey <APIKEY>
#     python analyst_tool_shared_config.py list
# With backend = local, nothing changes — only these local values are used.
# ─────────────────────────────────────────────────────────────────────────────

[ABUSE_IP_DB]
accept = application/json
key =

[VIRUS_TOTAL]
accept = application/json
x-apikey =  
user = 

