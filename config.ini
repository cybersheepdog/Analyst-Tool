[CVE]
# Optional NVD API key (raises NVD rate limits). CVE lookups work without one
# at low volume. Get a free key at https://nvd.nist.gov/developers/request-an-api-key
nvd_api_key =

[WINDOWS_EVENTS]
# Optional URL to a JSON feed of Windows Event IDs (same schema as the bundled
# windows_event_ids.json) to keep the catalog current. Blank = use the bundled
# file. Ports are enriched automatically from the IANA registry (no key needed).
feed_url =
